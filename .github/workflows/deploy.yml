name: Deploy Stage Client

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build HTML5 Client
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew html:dist --refresh-dependencies

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage-dist-latest  # Fixed name for easy retrieval
          path: html/build/dist/
          retention-days: 1  # Keep it short; Main will consume it quickly

      - name: Trigger Main Deployment
        run: |
          gh api repos/SlyCright/Klade/dispatches \
            -f event_type=deploy-main
        env:
          GITHUB_TOKEN: ${{ secrets.MAIN_REPO_TRIGGER_TOKEN }}  # Your PAT here